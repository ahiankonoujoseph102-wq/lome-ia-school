<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Livre ouvert avec un signet doré">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a45"/><stop offset="0.55" stop-color="#0b1030"/><stop offset="1" stop-color="#050817"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="0.6" stop-color="#4c1d95" stop-opacity="0.18"/><stop offset="1" stop-color="#4c1d95" stop-opacity="0"/></radialGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
  <linearGradient id="violetDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#3b1a8a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#f5a70b"/></linearGradient>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<ellipse cx="800" cy="500" rx="760" ry="560" fill="url(#glow)"/>
<g fill="none" stroke="#a78bfa" stroke-opacity="0.10" stroke-width="3"><circle cx="800" cy="500" r="330"/><circle cx="800" cy="500" r="470"/><circle cx="800" cy="500" r="620"/></g>
<g fill="#fde68a"><circle cx="150" cy="160" r="7" opacity=".7"/><circle cx="262" cy="250" r="5" opacity=".5"/><circle cx="1440" cy="190" r="7" opacity=".7"/><circle cx="1350" cy="120" r="4" opacity=".5"/><circle cx="130" cy="840" r="5" opacity=".5"/><circle cx="1470" cy="820" r="6" opacity=".6"/><circle cx="1180" cy="900" r="4" opacity=".5"/></g>
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
</defs>
<!-- feuilles qui s'envolent -->
<g opacity=".9">
  <g transform="rotate(-14 330 300)"><rect x="250" y="220" width="160" height="200" rx="18" fill="#1b2560" stroke="#a78bfa" stroke-opacity=".7" stroke-width="5"/><rect x="278" y="258" width="104" height="14" rx="7" fill="#c4b5fd"/><rect x="278" y="292" width="76" height="14" rx="7" fill="#8b5cf6"/><rect x="278" y="326" width="96" height="14" rx="7" fill="#8b5cf6"/></g>
  <g transform="rotate(12 1290 270)"><rect x="1210" y="190" width="160" height="200" rx="18" fill="#1b2560" stroke="#a78bfa" stroke-opacity=".7" stroke-width="5"/><rect x="1238" y="228" width="104" height="14" rx="7" fill="#c4b5fd"/><rect x="1238" y="262" width="76" height="14" rx="7" fill="#8b5cf6"/><rect x="1238" y="296" width="96" height="14" rx="7" fill="#8b5cf6"/></g>
</g>
<g filter="url(#shadow)">
  <!-- couverture -->
  <path d="M370 400 C560 350 700 370 800 430 C900 370 1040 350 1230 400 L1250 790 C1060 750 920 770 800 830 C680 770 540 750 350 790Z" fill="url(#violetDark)"/>
  <!-- pages -->
  <path d="M400 370 C560 330 700 345 800 405 L800 775 C700 715 560 700 400 740Z" fill="url(#page)"/>
  <path d="M1200 370 C1040 330 900 345 800 405 L800 775 C900 715 1040 700 1200 740Z" fill="url(#pageR)"/>
</g>
<path d="M800 405 V775" stroke="#a78bfa" stroke-opacity=".6" stroke-width="6"/>
<!-- texte (barres) page gauche -->
<g fill="#6d28d9" opacity=".75"><rect x="470" y="450" width="250" height="20" rx="10" transform="rotate(-4 470 450)" fill="#fbbf24" opacity="1"/><rect x="470" y="510" width="270" height="14" rx="7" transform="rotate(-4 470 510)"/><rect x="470" y="550" width="250" height="14" rx="7" transform="rotate(-4 470 550)"/><rect x="470" y="590" width="270" height="14" rx="7" transform="rotate(-4 470 590)"/><rect x="470" y="630" width="180" height="14" rx="7" transform="rotate(-4 470 630)"/></g>
<!-- page droite : image + texte -->
<g transform="rotate(4 880 500)"><rect x="880" y="450" width="250" height="130" rx="18" fill="#c4b5fd"/><circle cx="940" cy="494" r="18" fill="#fbbf24"/><path d="M880 560 l70 -50 l50 36 l50 -34 l80 60 v10 a18 18 0 0 1 -18 18 h-214 a18 18 0 0 1 -18 -18z" fill="#6d28d9"/></g>
<g fill="#6d28d9" opacity=".75"><rect x="880" y="620" width="270" height="14" rx="7" transform="rotate(4 880 620)"/><rect x="880" y="660" width="220" height="14" rx="7" transform="rotate(4 880 660)"/></g>
<!-- signet doré -->
<path d="M740 395 h60 v440 l-30 -34 l-30 34z" fill="url(#gold)" transform="translate(0 -50) translate(-20 0)"/>
<!-- crayon -->
<g transform="translate(1330 720) rotate(38)"><rect x="-26" y="-120" width="52" height="190" rx="10" fill="url(#gold)"/><path d="M-26 70 L0 128 L26 70z" fill="#fde68a"/><path d="M-9 106 L0 128 L9 106z" fill="#0b1030"/><rect x="-26" y="-140" width="52" height="30" rx="10" fill="#c4b5fd"/></g>
<g stroke="#fde68a" stroke-width="10" stroke-linecap="round"><path d="M230 700 v50 M205 725 h50" opacity=".8"/></g>
</svg>
